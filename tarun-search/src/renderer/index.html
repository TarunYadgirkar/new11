<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Tarun Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Sidebar">
        <div class="sb-top drag">
          <div class="traffic-space"></div>
          <button class="icon-btn nodrag" id="btn-sidebar" title="Hide sidebar"></button>
          <div class="grow"></div>
          <button class="icon-btn nodrag" id="btn-back" title="Back"></button>
          <button class="icon-btn nodrag" id="btn-forward" title="Forward"></button>
          <button class="icon-btn nodrag" id="btn-reload" title="Reload"></button>
        </div>
        <div class="urlbar nodrag" id="urlbar" role="button" tabindex="0" title="Search or enter address">
          <span class="url-icon" id="url-icon"></span>
          <span class="url-text" id="url-text">Search or enter address</span>
          <span class="url-actions" id="url-actions"></span>
        </div>
        <div class="sb-scroll" id="sb-scroll">
          <div class="fav-grid" id="favorites" data-drop="favorite"></div>
          <div class="space-title" id="space-title"></div>
          <div class="tab-list" id="pinned" data-drop="pinned"></div>
          <div class="divider" id="today-divider"><span>Today</span><button class="link-btn" id="btn-clear-today" title="Archive all of today's tabs">Clear</button></div>
          <button class="new-tab-btn" id="btn-new-tab"><span class="nt-plus"></span><span>New Tab</span></button>
          <div class="tab-list" id="tabs" data-drop="tab"></div>
        </div>
        <div class="sb-dock" id="dock">
          <div id="prompts"></div>
          <div id="focus-chip"></div>
          <div id="downloads"></div>
          <div id="toasts" aria-live="polite"></div>
        </div>
        <div class="sb-bottom">
          <button class="icon-btn" id="btn-library" title="History & Archive"></button>
          <div class="space-dots" id="space-dots"></div>
          <button class="icon-btn" id="btn-new-space" title="New space"></button>
          <button class="icon-btn" id="btn-settings" title="Settings"></button>
        </div>
        <div class="resizer" id="resizer" title="Drag to resize"></div>
      </aside>
      <main id="stage">
        <div class="titlebar drag" id="titlebar">
          <button class="icon-btn nodrag show-collapsed" id="btn-sidebar-2" title="Show sidebar"></button>
          <div class="title-text" id="title-text"></div>
          <div class="findbar nodrag" id="findbar" hidden>
            <span class="find-icon"></span>
            <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off" />
            <span class="find-count" id="find-count"></span>
            <button class="icon-btn small" id="find-prev" title="Previous (Shift+Enter)"></button>
            <button class="icon-btn small" id="find-next" title="Next (Enter)"></button>
            <button class="icon-btn small" id="find-close" title="Close (Esc)"></button>
          </div>
        </div>
        <div id="content">
          <div class="pane" id="pane-main"></div>
          <div class="pane" id="pane-split" hidden></div>
          <div class="split-tools" id="split-tools" hidden></div>
        </div>
      </main>
    </div>
    <div class="edge-zone" id="edge-zone"></div>
    <div id="backdrop" hidden></div>
    <div id="peek-root" hidden></div>
    <div id="overlay-root" hidden></div>
    <script src="icons.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
